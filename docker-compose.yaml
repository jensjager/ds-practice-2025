services:
  frontend:
    build:
      # Use the current directory as the build context
      # This allows us to access the files in the current directory inside the Dockerfile
      context: ./
      dockerfile: ./frontend/Dockerfile
    ports:
      # Expose port 8080 on the host, and map port 80 of the container to port 8080 on the host
      # Access the application at http://localhost:8080
      - "8080:80"
    volumes:
      # Mount the frontend directory
      - ./frontend/src:/usr/share/nginx/html
    depends_on:
      orchestrator:
        condition: service_healthy
  orchestrator:
    build:
      # Use the current directory as the build context
      # This allows us to access the files in the current directory inside the Dockerfile
      context: ./
      # Use the Dockerfile in the orchestrator directory
      dockerfile: ./orchestrator/Dockerfile
    ports:
      # Expose port 8081 on the host, and map port 5000 of the container to port 8081 on the host
      - 8081:5000
    environment:
      # Pass the environment variables to the container
      # The PYTHONUNBUFFERED environment variable ensures that the output from the application is logged to the console
      - PYTHONUNBUFFERED=TRUE
      # The PYTHONFILE environment variable specifies the absolute entry point of the application
      # Check app.py in the orchestrator directory to see how this is used
      - PYTHONFILE=/app/orchestrator/src/app.py
      - RPC_TIMEOUT_SECONDS=5
      - ORDER_QUEUE_TARGET=order_queue:50054
    volumes:
      # Mount the utils directory in the current directory to the /app/utils directory in the container
      - ./utils:/app/utils
      # Mount the orchestrator/src directory in the current directory to the /app/orchestrator/src directory in the container
      - ./orchestrator/src:/app/orchestrator/src
    depends_on:
      fraud_detection:
        condition: service_healthy
      transaction_verification:
        condition: service_healthy
      suggestions:
        condition: service_healthy
      order_queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  order_queue:
    build:
      context: ./
      dockerfile: ./order_queue/Dockerfile
    ports:
      - 50054:50054
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/order_queue/src/app.py
      - ORDER_QUEUE_PORT=50054
    volumes:
      - ./utils:/app/utils
      - ./order_queue/src:/app/order_queue/src
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 50054), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  fraud_detection:
    build:
      context: ./
      dockerfile: ./fraud_detection/Dockerfile
    ports:
      - 50051:50051
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/fraud_detection/src/app.py
      - ORDER_STATE_TTL_SECONDS=900
      - ORDER_STATE_CLEANUP_INTERVAL_SECONDS=30
    volumes:
      - ./utils:/app/utils
      - ./fraud_detection/src:/app/fraud_detection/src
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 50051), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  transaction_verification:
    build:
      context: ./
      dockerfile: ./transaction_verification/Dockerfile
    ports:
      - 50052:50052
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/transaction_verification/src/app.py
      - ORDER_STATE_TTL_SECONDS=900
      - ORDER_STATE_CLEANUP_INTERVAL_SECONDS=30
    volumes:
      - ./utils:/app/utils
      - ./transaction_verification/src:/app/transaction_verification/src
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 50052), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  suggestions:
    build:
      context: ./
      dockerfile: ./suggestions/Dockerfile
    ports:
      - 50053:50053
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/suggestions/src/app.py
      - ORDER_STATE_TTL_SECONDS=900
      - ORDER_STATE_CLEANUP_INTERVAL_SECONDS=30
    volumes:
      - ./utils:/app/utils
      - ./suggestions/src:/app/suggestions/src
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 50053), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  books_database_1:
    build:
      context: ./
      dockerfile: ./books_database/Dockerfile
    ports:
      - 50056:50056
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/books_database/src/app.py
      - BOOKS_DATABASE_PORT=50056
      - IS_PRIMARY=true
      - PRIMARY_TARGET=books_database_1:50056
      - BACKUP_TARGETS=books_database_2:50057,books_database_3:50058
    volumes:
      - ./utils:/app/utils
      - ./books_database/src:/app/books_database/src
  books_database_2:
    build:
      context: ./
      dockerfile: ./books_database/Dockerfile
    ports:
      - 50057:50057
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/books_database/src/app.py
      - BOOKS_DATABASE_PORT=50057
      - IS_PRIMARY=false
      - PRIMARY_TARGET=books_database_1:50056
    volumes:
      - ./utils:/app/utils
      - ./books_database/src:/app/books_database/src
  books_database_3:
    build:
      context: ./
      dockerfile: ./books_database/Dockerfile
    ports:
      - 50058:50058
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/books_database/src/app.py
      - BOOKS_DATABASE_PORT=50058
      - IS_PRIMARY=false
      - PRIMARY_TARGET=books_database_1:50056
    volumes:
      - ./utils:/app/utils
      - ./books_database/src:/app/books_database/src
  payment:
    build:
      context: ./
      dockerfile: ./payment/Dockerfile
    ports:
      - 50059:50057
    environment:
      - PYTHONUNBUFFERED=TRUE
      - PYTHONFILE=/app/payment/src/app.py
      - PAYMENT_PORT=50057
    volumes:
      - ./utils:/app/utils
      - ./payment/src:/app/payment/src
  order_executor_1: &order_executor_base
    build:
      context: ./
      dockerfile: ./order_executor/Dockerfile
    environment: &order_executor_env
      PYTHONUNBUFFERED: "TRUE"
      PYTHONFILE: /app/order_executor/src/app.py
      ORDER_EXECUTOR_PORT: "50055"
      EXECUTOR_ID: "1"
      EXECUTOR_TARGET: order_executor_1:50055
      EXECUTOR_PEERS: 1:order_executor_1:50055,2:order_executor_2:50055,3:order_executor_3:50055,4:order_executor_4:50055
      ORDER_QUEUE_TARGET: order_queue:50054
      BOOKS_DATABASE_TARGET: books_database_1:50056
      PAYMENT_TARGET: payment:50057
      RPC_TIMEOUT_SECONDS: "2"
      ELECTION_WAIT_SECONDS: "3"
      LEADER_CHECK_INTERVAL_SECONDS: "2"
      DEQUEUE_INTERVAL_SECONDS: "1"
    volumes:
      - ./utils:/app/utils
      - ./order_executor/src:/app/order_executor/src
    depends_on:
      order_queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('localhost', 50055), 3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  order_executor_2:
    <<: *order_executor_base
    environment:
      <<: *order_executor_env
      EXECUTOR_ID: "2"
      EXECUTOR_TARGET: order_executor_2:50055
  order_executor_3:
    <<: *order_executor_base
    profiles: ["n3", "n4"]
    environment:
      <<: *order_executor_env
      EXECUTOR_ID: "3"
      EXECUTOR_TARGET: order_executor_3:50055
  order_executor_4:
    <<: *order_executor_base
    profiles: ["n4"]
    environment:
      <<: *order_executor_env
      EXECUTOR_ID: "4"
      EXECUTOR_TARGET: order_executor_4:50055